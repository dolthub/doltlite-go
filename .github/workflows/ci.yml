name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Latest stable covers every module: the core is go 1.23 while the
          # blobs3 submodule needs 1.24 (aws-sdk-go-v2).
          go-version: stable

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Vet and test every module in the repo (the root module plus any
      # submodule, e.g. the future blobs3 S3 adapter with its own go.mod).
      - name: Vet and test all modules
        run: |
          set -euo pipefail
          for mod in $(find . -name go.mod -not -path '*/vendor/*'); do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            ( cd "$dir" && go vet ./... && go test -race ./... )
            echo "::endgroup::"
          done
